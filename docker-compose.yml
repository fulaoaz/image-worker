services:
  app:
    image: ghcr.io/fulaoaz/image-worker:latest
    container_name: image-worker
    ports:
      - "3000:3000"
    network_mode: bridge
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    environment:
      IMAGE_WORKER_DATA_DIR: /app/data
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      AI_MODEL_CHANNELS: ${AI_MODEL_CHANNELS:-}
      AI_CHANNELS: ${AI_CHANNELS:-}
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}
    volumes:
      - ./data:/app/data
    # 统计分析（可选，默认关闭）。每家一个独立变量，填了谁就启用谁，可同时启用多家：
    # environment:
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX                    # Google Analytics 4 衡量 ID
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # 百度统计站点 ID
    #
    # 管理员模型渠道（可选）：先在 .env 配置 ADMIN_TOKEN，再访问 /admin 保存渠道。
    # API Key 会写入 ./data/ai-model-channels.json，仅由服务端代理读取，不会下发给浏览器。
    # 也可用环境变量作为首次启动时的预置来源：
    #   AI_MODEL_CHANNELS: >-
    #     [{"id":"server","name":"服务器渠道","baseUrl":"https://api.openai.com",
    #       "apiKey":"sk-xxx","apiFormat":"openai","models":["gpt-image-2","gpt-5.5"]}]
